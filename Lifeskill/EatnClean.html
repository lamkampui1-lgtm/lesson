:root{

const $=id=>document.getElementById(id);
let cur=-1, runId=0, voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/yue/i.test(v.lang))||vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function clean(t){return t.replace(/[「」]/g,'').replace(/：/g,'，')}
function speak(text){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(clean(text));u.lang=voice?voice.lang:'zh-HK';if(voice)u.voice=voice;u.rate=.85;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,Math.max(4000,text.length*450))}catch(e){res()}})}
function stop(){runId++;stopAud();try{speechSynthesis.cancel()}catch(e){};document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'))}
async function readPage(){
  stop();const my=runId;const els=[...document.querySelectorAll('[data-read]')];
  for(const el of els){if(my!==runId)return;el.classList.add('on');await speak(el.dataset.read);el.classList.remove('on');if(my!==runId)return;await new Promise(r=>setTimeout(r,250))}
}
const SONG=[[['慢','C4',1],['慢','D4',1],['食','E4',1],['飯','C4',1]],[['細','C4',1],['細','D4',1],['啖','E4',1],['啦','C4',1]],[['飽','E4',1],['就','F4',1],['停','G4',2]],[['飽','E4',1],['就','F4',1],['停','G4',2]],[['唔','G4',.5],['舒','A4',.5],['服','G4',.5],['講','F4',.5],['出','E4',1],['嚟','C4',1]],[['搵','G4',.5],['人','A4',.5],['嚟','G4',.5],['幫','F4',.5],['手','E4',1],['啦','C4',1]],[['洗','C4',1],['乾','G3',1],['淨','C4',2]],[['好','C4',1],['衛','G3',1],['生','C4',2]]];
const FREQ={G3:196,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440};
let actx=null;function ac(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}return actx}
function tone(f,dur){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.35,t0+.03);g.gain.setValueAtTime(.35,t0+dur*.7);g.gain.linearRampToValueAtTime(0,t0+dur*.95);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur)}
async function playSong(){const my=runId;const BEAT=.62;const spans=[...document.querySelectorAll('.ln span')];let k=0;
  for(const line of SONG){for(const [w,n,b] of line){if(my!==runId)return;spans.forEach(s=>s.classList.remove('sing'));const sp=spans[k++];if(sp)sp.classList.add('sing');tone(FREQ[n],b*BEAT);await new Promise(r=>setTimeout(r,b*BEAT*1000))}}
  spans.forEach(s=>s.classList.remove('sing'))}
const AUD=()=>document.getElementById('tsong');
function stopAud(){try{const a=AUD();a.pause()}catch(e){}}
function playAud(fromStart){const a=AUD();try{if(fromStart)a.currentTime=0;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}}
function updBtn(){}
setInterval(()=>{const a=AUD(),bar=document.querySelector('.prog i');if(bar&&a.duration)bar.style.width=(a.currentTime/a.duration*100)+'%';updBtn()},300);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  const s=$('stage');$('bar').hidden=cur<0;$('count').hidden=cur<0;
  if(cur<0){
    $('topic').textContent='自學時間';$('app').className='cream';
    s.innerHTML=`<div class="cover"><h1>食飯唔舒服，點算好？<br>清潔小幫手</h1><div class="chips"><span>進食時不適</span><span>飲食注意</span><span>清潔門窗傢俬</span><span>如廁</span></div><p>撳「開始」，iPad 會讀出每一頁</p><button class="go" id="go" type="button">開始 ▶</button></div>`;
    $('go').onclick=()=>{ac();try{const au=AUD();au.muted=true;const pr=au.play();const done=()=>{au.pause();au.currentTime=0;au.muted=false};if(pr&&pr.then)pr.then(done,done);else done()}catch(e){};cur=0;render()};return;
  }
  const p=PAGES[cur];$('topic').textContent=p.topic;$('count').textContent=`${cur+1} / ${PAGES.length}`;
  $('app').className=cur%2?'mint':'cream';
  if(p.kind==='steps'){
    s.innerHTML=`<div class="steps"><h1 data-read="${esc(p.sayTitle||p.title)}">${esc(p.title)}</h1><div class="list${p.items.length>3?' many':''}">${p.items.map((it,i)=>`<div class="item" data-read="${esc(it.say||it.text)}"><span class="num">${i+1}</span>${it.icon?`<span class="ic">${it.icon}</span>`:''}<p>${esc(it.text)}</p></div>`).join('')}</div>${p.after?`<p class="gest">（${esc(p.after)}）</p>`:''}</div>`;
  }else if(p.kind==='end'){
    s.innerHTML=`<div class="endp"><div class="endtop"><div class="art">${p.art}</div><div class="words"><span class="key">${esc(p.key)}</span><p class="say" data-read="${esc(p.says[0])}">${esc(p.segs[0])}</p></div></div><div class="tsong"><h2>如廁歌《乾乾淨淨齊齊做好》</h2><div style="display:flex;gap:20px;align-items:center;width:100%"><button class="playbtn" id="tplay" type="button">🔁 重播</button><div class="prog" style="flex:1"><i></i></div></div></div></div>`;
    $('tplay').onclick=()=>{stop();playAud(true)};
  }else{
    s.innerHTML=`<div class="scene"><div class="art">${p.art}</div><div class="words"><span class="key">${esc(p.key)}</span>${p.segs.map((t,i)=>`<p class="say" data-read="${esc((p.says||[])[i]||t)}">${esc(t)}</p>`).join('')}${p.gest?`<p class="gest">（${esc(p.gest)}）</p>`:''}</div></div>`;
  }
  $('prev').disabled=cur===0;
  $('next').textContent=cur===PAGES.length-1?'再讀一次 ⟲':'下一頁 ▶';
  readPage().then(()=>{if(p.kind==='end'&&PAGES[cur]===p){playAud(true);updBtn()}});
}
$('prev').onclick=()=>{if(cur>0){cur--;render()}};
$('next').onclick=()=>{cur=cur<PAGES.length-1?cur+1:0;render()};
$('again').onclick=()=>readPage();
render();
</script>
